# Secret scanning (backend Q30, its docs/08 §5): gitleaks over the whole history, on every push and pull request. A workflow of its
# own, so it runs on every branch while the build and tests keep their own triggers; it takes under a minute.
# gitleaks is the release binary itself, pinned and checked against its published SHA-256: no third-party action.
name: Secrets

on:
  pull_request:
  push:

permissions:
  contents: read

jobs:
  gitleaks:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GITLEAKS_VERSION: "8.30.1"
      GITLEAKS_SHA256: "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb"
    steps:
      # The whole history: a secret committed once and removed later is still in it.
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Install gitleaks
        shell: bash
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/gitleaks.tar.gz"
          curl -sSfL -o "$archive" \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "${GITLEAKS_SHA256}  ${archive}" | sha256sum -c -
          tar -xzf "$archive" -C "$RUNNER_TEMP" gitleaks

      # --redact: a finding names the file, line and rule, never the secret, so the log doesn't leak it again.
      - name: Scan the history
        shell: bash
        run: |
          set -euo pipefail
          config=()
          if [ -f .gitleaks.toml ]; then config=(--config .gitleaks.toml); fi
          "$RUNNER_TEMP/gitleaks" git "${config[@]}" --redact --no-banner --exit-code 1 .
