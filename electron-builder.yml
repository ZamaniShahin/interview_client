# Packaging, Windows first (NSIS, x64). Signing (cloud HSM) and automatic updates come with 4.2, macOS with Phase 5.
# The appId is a placeholder until the domain is chosen (backend decisions.md, Q4).
appId: com.sotto.desktop
productName: Sotto
directories:
  buildResources: build
  output: dist
# Only the built app and the packages main needs at run time (package.json's dependencies): the pages' packages are
# bundled into out/renderer by Vite and stay out (decisions §21, 4.1).
files:
  - out/**/*
  - package.json
asar: true
# better-sqlite3-multiple-ciphers ships N-API binaries that Electron loads as they are (decisions, 2026-11-09): nothing is
# rebuilt, so packaging needs no compiler.
npmRebuild: false
# Hardening (4.1): Electron's fuses, flipped in the packaged binary. electron-builder embeds the ASAR's integrity
# hash in the executable, which then refuses an app.asar that was changed, and loads the app from it alone.
electronFuses:
  runAsNode: false
  enableCookieEncryption: true
  enableNodeOptionsEnvironmentVariable: false
  enableNodeCliInspectArguments: false
  enableEmbeddedAsarIntegrityValidation: true
  onlyLoadAppFromAsar: true
  loadBrowserProcessSpecificV8Snapshot: false
  # The pages come from app://sotto/ (main/windows/app-protocol.ts): file:// needs no privileges of its own.
  grantFileProtocolExtraPrivileges: false
win:
  target:
    - target: nsis
      arch:
        - x64
nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
